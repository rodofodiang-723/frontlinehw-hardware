<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Found | Frontline Hardware</title>
<link rel="icon" type="image/svg+xml" href="frontlinehw-logo.svg">
<style>
:root{--black:#111;--yellow:#ffc107;--paper:#efece5;--muted:#6b6b65;--display:"Arial Narrow",Arial,sans-serif;--body:Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--black);font-family:var(--body);display:grid;place-items:center;padding:24px}
main{width:min(720px,100%);background:#fff;border-top:8px solid var(--yellow);padding:clamp(32px,8vw,72px);box-shadow:0 18px 50px rgba(17,17,17,.12)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem}
.brand img{width:42px;height:42px;object-fit:contain}
.code{margin:54px 0 8px;color:#9b7800;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:var(--display);font-size:clamp(3rem,10vw,6.5rem);line-height:.9;margin:0 0 20px;letter-spacing:.02em}
p{max-width:500px;color:var(--muted);line-height:1.65;margin:0 0 28px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;text-decoration:none;font-weight:700;font-size:.82rem;border:2px solid var(--black)}
a.primary{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
a.secondary{color:var(--black)}
a:hover{transform:translateY(-2px)}
@media(max-width:480px){main{padding:28px}.code{margin-top:42px}.actions{display:grid}.actions a{width:100%}}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="frontlinehw-logo.svg" alt=""> <span>Frontline Hardware</span></div>
  <div class="code">Error 404</div>
  <h1>Page not found.</h1>
  <p>The page you are looking for may have moved or the address may be incorrect. Return to our store or contact us for help finding what you need.</p>
  <div class="actions">
    <a class="primary" href="index.html">Back to home</a>
    <a class="secondary" href="index.html#products">Browse products</a>
    <a class="secondary" href="https://wa.me/254727791535" target="_blank" rel="noopener">WhatsApp us</a>
  </div>
</main>
</body>
</html>
